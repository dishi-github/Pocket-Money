plugins {
    id "com.android.application"
}

android {
    namespace "com.pocketmoney"
    compileSdk 35

    defaultConfig {
        applicationId "com.pocketmoney"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "PocketMoney-${variant.versionName}-${variant.name}.apk"
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core:1.9.0"
}
